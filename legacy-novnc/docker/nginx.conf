worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    server {
        listen 33333;

        # 权限管理：noVNC 页面与 WebSocket 均需登录
        auth_basic "mdcx-diy login";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # noVNC 静态页面（/ 由 entrypoint 生成的自适应缩放 index.html 引导到 ?scale=fit）
        location / {
            root /usr/share/novnc;
            index index.html;
            try_files $uri /index.html;
        }

        # SMB 共享管理页面（反代到宿主机 mdcx-smb-web 服务，同样要求登录）
        location /manager/ {
            proxy_pass http://host-gateway:33344/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # VNC WebSocket 隧道（转发到容器内 websockify）
        location /websockify {
            proxy_pass http://127.0.0.1:5901/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}